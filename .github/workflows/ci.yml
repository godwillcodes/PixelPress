name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # The action runs this bundle straight from the repo, so a stale commit of
      # it would ship behaviour that no longer matches the source.
      - name: Check the committed CLI bundle is current
        run: |
          pnpm build:cli
          git diff --exit-code dist/exact80.mjs
